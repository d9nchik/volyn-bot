name: Scheduler diagnostic
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/scheduler-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record triggering event
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime, timezone
          print('event:', os.environ['GITHUB_EVENT_NAME'])
          print('utc:', datetime.now(timezone.utc).isoformat())
          print('commit:', os.environ['GITHUB_SHA'])
          PY
